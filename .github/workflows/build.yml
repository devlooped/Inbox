# Builds and runs tests in all three supported OSes
# Pushes CI feed if secrets.SLEET_CONNECTION is provided

name: build
on: 
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        description: Configuration
        options: 
        - Release
        - Debug
  push:
    branches: [ main, 'feature/*', 'rel/*' ]
    paths-ignore:
      - changelog.md
      - readme.md
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_NOLOGO: true
  PackOnBuild: true
  GeneratePackageOnBuild: true
  VersionPrefix: 42.42.${{ github.run_number }}
  VersionLabel: ${{ github.ref }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  Configuration: ${{ github.event.inputs.configuration || 'Release' }}
  SLEET_FEED_URL: ${{ vars.SLEET_FEED_URL }}

defaults:
  run:
    shell: bash

jobs:
  os-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lookup.outputs.matrix }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        
      - name: 🔎 lookup
        id: lookup
        shell: pwsh
        run: |
          $path = './.github/workflows/os-matrix.json'
          $os = if (test-path $path) { cat $path } else { '["ubuntu-latest"]' }
          echo "matrix=$os" >> $env:GITHUB_OUTPUT

  build:
    needs: os-matrix
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.os-matrix.outputs.matrix) }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ⚙ go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/WhatsBox.Native/go.mod
          cache-dependency-path: src/WhatsBox.Native/go.sum

      - name: 📦 pack rid
        id: rid
        shell: pwsh
        run: |
          $rid = switch -Wildcard ('${{ matrix.os }}') {
            'windows-11-arm*' { 'win-arm64' }
            'windows*'        { 'win-x64' }
            'ubuntu-*-arm*'   { 'linux-arm64' }
            'ubuntu*'         { 'linux-x64' }
            'macos-*-intel*'  { 'osx-x64' }
            'macos*'          { 'osx-arm64' }
            default           { throw "Unsupported OS for RID pack: ${{ matrix.os }}" }
          }
          "rid=$rid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $ErrorActionPreference = 'Stop'
          Write-Host "Packing Inbox + WhatsBox pointer + WhatsBox.$rid into bin/ before WhatsDemo restore"
          # GeneratePackageOnBuild=true makes `dotnet pack` skip Build (NU5026: WhatsBox.dll missing).
          dotnet pack src/Inbox/Inbox.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:inbox-pack.binlog
          if ($LASTEXITCODE -ne 0) { throw "Inbox pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:pointer-pack.binlog
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox pointer pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -r $rid -p:GeneratePackageOnBuild=false -bl:"pack-$rid.binlog"
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox $rid pack failed with exit code $LASTEXITCODE." }

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        shell: pwsh
        run: dnx --yes retest -- --no-build

      - name: 📦 pack wd
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = '${{ steps.rid.outputs.rid }}'
          Write-Host "Packing wd.$rid"
          dotnet pack src/WhatsDemo/WhatsDemo.csproj -c $env:Configuration -r $rid -p:GeneratePackageOnBuild=false -bl:"pack-wd-$rid.binlog"
          if ($LASTEXITCODE -ne 0) { throw "wd $rid pack failed with exit code $LASTEXITCODE." }

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.rid.outputs.rid }}
          path: bin/*.${{ steps.rid.outputs.rid }}.*.nupkg
          retention-days: 7
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-${{ matrix.os }}
          path: '*.binlog'

      - name: 🚀 sleet
        env:
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        if: env.SLEET_CONNECTION != ''
        run: |
          dotnet tool update sleet -g --allow-downgrade --version $(curl -s --compressed ${{ vars.SLEET_FEED_URL }} | jq '.["sleet:version"]' -r)        
          sleet push bin --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=${{ secrets.SLEET_CONNECTION }}" -p "SLEET_FEED_TYPE=azure" || echo "No packages found"

  dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ✓ ensure format
        run: |
          dotnet format whitespace --verify-no-changes --no-restore -v:diag --exclude ~/.nuget
          dotnet format style --verify-no-changes --no-restore -v:diag --exclude ~/.nuget
