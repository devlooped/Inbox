# Builds a final release version and pushes to nuget.org
# whenever a release is published.
# Requires: secrets.NUGET_API_KEY

name: publish
on:
  release:
    types: [prereleased, released]

env:
  DOTNET_NOLOGO: true
  Configuration: Release
  VersionLabel: ${{ github.ref }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  SLEET_FEED_URL: https://api.nuget.org/v3/index.json

defaults:
  run:
    shell: pwsh

jobs:
  native:
    name: native-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ⚙ go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: 📦 pack
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:"pointer-pack.binlog"
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox pointer pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -r ${{ matrix.rid }} -p:GeneratePackageOnBuild=false -bl:"pack-${{ matrix.rid }}.binlog"
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox ${{ matrix.rid }} pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/WhatsDemo/WhatsDemo.csproj -c $env:Configuration -r ${{ matrix.rid }} -p:GeneratePackageOnBuild=false -bl:"pack-wd-${{ matrix.rid }}.binlog"
          if ($LASTEXITCODE -ne 0) { throw "wd ${{ matrix.rid }} pack failed with exit code $LASTEXITCODE." }

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: bin/*.${{ matrix.rid }}.*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-${{ matrix.rid }}
          path: '*.binlog'

  publish:
    needs: native
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ⚙ go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: 📦 whatsbox
        run: |
          $os = if ([System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform(
              [System.Runtime.InteropServices.OSPlatform]::Windows)) { 'win' }
          elseif ([System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform(
              [System.Runtime.InteropServices.OSPlatform]::Linux)) { 'linux' }
          elseif ([System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform(
              [System.Runtime.InteropServices.OSPlatform]::OSX)) { 'osx' }
          else { throw 'Unsupported OS for WhatsBox RID packages.' }
          $cpu = switch ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture) {
            'X64' { 'x64' }
            'Arm64' { 'arm64' }
            default { throw "Unsupported architecture '$_' for WhatsBox RID packages." }
          }
          $rid = "$os-$cpu"
          $ErrorActionPreference = 'Stop'
          Write-Host "Packing WhatsBox pointer + WhatsBox.$rid into bin/ before WhatsDemo restore"
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:pointer-pack.binlog
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox pointer pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -r $rid -p:GeneratePackageOnBuild=false -bl:"pack-$rid.binlog"
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox $rid pack failed with exit code $LASTEXITCODE." }

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        run: dnx --yes retest -- --no-build

      - name: 📦 pointer
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack src/WhatsBox/WhatsBox.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:pointer-pack.binlog
          if ($LASTEXITCODE -ne 0) { throw "WhatsBox pointer pack failed with exit code $LASTEXITCODE." }
          dotnet pack src/WhatsDemo/WhatsDemo.csproj -c $env:Configuration -p:GeneratePackageOnBuild=false -bl:pointer-pack-wd.binlog
          if ($LASTEXITCODE -ne 0) { throw "wd pointer pack failed with exit code $LASTEXITCODE." }

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-pointer
          path: |
            bin/WhatsBox.*.nupkg
            bin/wd.*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: 📥 packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: bin
          merge-multiple: true

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-publish
          path: '*.binlog'

      - name: ✅ validate
        working-directory: bin
        run: |
          $invalid = Get-ChildItem -File -Filter "*.42.42*.nupkg"
          if ($invalid) {
            Write-Error "Found dev/local packages with disallowed 42.42* version prefix:`n$($invalid.Name -join "`n")"
            exit 1
          }

      - name: 🚀 nuget
        if: ${{ env.NUGET_API_KEY != '' && github.event.action != 'prereleased' }}
        run: |
          $packages = @(Get-ChildItem bin -Filter *.nupkg | Where-Object Name -NotLike '*.symbols.nupkg' | Sort-Object Name)
          $runtimePackagePattern = '\.(win-x64|win-arm64|linux-x64|linux-arm64|osx-x64|osx-arm64)\.'
          $runtimePackages = @($packages | Where-Object Name -Match $runtimePackagePattern)
          $pointerPackages = @($packages | Where-Object Name -NotMatch $runtimePackagePattern)

          if ($runtimePackages.Count -eq 0) { throw 'No RID-specific packages found.' }
          if ($pointerPackages.Count -eq 0) { throw 'No top-level pointer package found.' }

          foreach ($package in $runtimePackages) {
            dotnet nuget push $package.FullName -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY --skip-duplicate
          }

          foreach ($package in $pointerPackages) {
            dotnet nuget push $package.FullName -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY --skip-duplicate
          }

      - name: 🚀 sleet
        if: env.SLEET_CONNECTION != ''
        run: |
          $packages = @(Get-ChildItem bin -Filter *.nupkg | Where-Object Name -NotLike '*.symbols.nupkg' | Sort-Object Name)
          $runtimePackagePattern = '\.(win-x64|win-arm64|linux-x64|linux-arm64|osx-x64|osx-arm64)\.'
          $runtimePackages = @($packages | Where-Object Name -Match $runtimePackagePattern)
          $pointerPackages = @($packages | Where-Object Name -NotMatch $runtimePackagePattern)

          if ($runtimePackages.Count -eq 0) { throw 'No RID-specific packages found.' }
          if ($pointerPackages.Count -eq 0) { throw 'No top-level pointer package found.' }

          $runtimePath = Join-Path $env:RUNNER_TEMP runtime-packages
          $pointerPath = Join-Path $env:RUNNER_TEMP pointer-package
          New-Item -ItemType Directory -Force -Path $runtimePath, $pointerPath | Out-Null

          Copy-Item -Path $runtimePackages.FullName -Destination $runtimePath
          Copy-Item -Path $pointerPackages.FullName -Destination $pointerPath

          $sleetVersion = (Invoke-RestMethod -Uri $env:SLEET_FEED_URL).'sleet:version'
          if ($sleetVersion) {
            dotnet tool update sleet -g --allow-downgrade --version $sleetVersion
          } else {
            dotnet tool update sleet -g --allow-downgrade
          }

          sleet push $runtimePath --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=$env:SLEET_CONNECTION" -p "SLEET_FEED_TYPE=azure"
          sleet push $pointerPath --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=$env:SLEET_CONNECTION" -p "SLEET_FEED_TYPE=azure"
